<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤ 阿瑜的专属告白 ❤</title>
    <!-- 背景音乐 -->
    <audio id="bgm" loop>
        <source src="https://cdn.jsdelivr.net/gh/ayuqwq/musicfzh@main/music.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap');
        
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
            font-family: 'ZCOOL QingKe HuangYou', cursive;
            cursor: pointer;
        }

        /* 隐藏音频控件 */
        #bgm {
            position: fixed;
            left: -999px;
            opacity: 0;
        }

        /* 原有样式保持不变... */
        .flow-column {
            position: fixed;
            top: -100vh;
            width: 10vw;
            left: calc(10vw * var(--col));
            height: 200vh;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            animation: flow 8s linear infinite;
        }
        .flow-text {
            color: #ff69b4;
            font-size: 4vw;
            opacity: 0.7;
            text-align: center;
            transform: rotate(10deg);
        }
        @keyframes flow {
            from { transform: translateY(0); }
            to { transform: translateY(100vh); }
        }

        .pop-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16vw !important;
            color: #fff;
            text-shadow: 0 0 4vw #ff69b4;
            opacity: 0;
            animation: 
                text-pop 2s ease-out forwards,
                text-disolve 1s ease-out 3s forwards;
        }

        @keyframes text-pop {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            60% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        @keyframes text-disolve {
            0% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(3);
                filter: blur(10px);
            }
        }

        .heart {
            font-size: 30vw;
            color: #ff69b4;
            animation: 
                heartbeat 1.2s ease-in-out infinite,
                heart-disolve 1s ease-out 3s forwards;
        }
        @keyframes heart-disolve {
            100% { 
                opacity: 0;
                transform: scale(2);
                filter: blur(15px);
            }
        }
    </style>
</head>
<body onclick="startPlayback()">
    <!-- 文字雨容器 -->
    <div id="flow-container"></div>

    <!-- 主要显示内容 -->
    <div id="heart" class="heart" style="display:none">❤️</div>
    <div id="text2025" class="pop-text" style="display:none">2025</div>
    <div id="text1" class="pop-text" style="display:none">情人节快乐</div>
    <div id="text2" class="pop-text" style="display:none">阿瑜 ❤ 月月</div>
    <div id="text3" class="pop-text" style="display:none">要一直在一起</div>
    <div id="text4" class="pop-text" style="display:none">我会永远陪着你</div>

    <script>
        // 音乐播放控制
        let musicPlayed = false;
        function startPlayback() {
            if (!musicPlayed) {
                const bgm = document.getElementById('bgm');
                bgm.play().catch(() => {
                    alert('请点击页面任意位置开始播放音乐');
                });
                bgm.volume = 0.5; // 初始音量50%
                musicPlayed = true;
            }
        }

        // 生成文字雨
        function createFlowText() {
            const container = document.getElementById('flow-container');
            const columns = 12;
            
            for(let col = 0; col < columns; col++) {
                const column = document.createElement('div');
                column.className = 'flow-column';
                column.style.setProperty('--col', col);
                column.style.animationDelay = `${col * 0.5}s`;
                
                for(let i = 0; i < 20; i++) {
                    const text = document.createElement('div');
                    text.className = 'flow-text';
                    text.textContent = Math.random() > 0.5 ? 'I Love You' : '❤';
                    column.appendChild(text);
                }
                container.appendChild(column);
            }
        }

        // 时间轴
        const timeline = [
            { time: 0, action: () => {
                createFlowText();
                startPlayback();
            }},
            { time: 5000, action: () => showElement('heart') },
            { time: 8000, action: () => hideElement('heart') },
            { time: 10000, action: () => showElement('text2025') },
            { time: 15000, action: () => switchElement('text2025', 'text1') },
            { time: 20000, action: () => switchElement('text1', 'text2') },
            { time: 25000, action: () => switchElement('text2', 'text3') },
            { time: 30000, action: () => switchElement('text3', 'text4') },
            { time: 36000, action: () => location.reload() }
        ];

        function showElement(id) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.style.animation = '';
            void el.offsetWidth;
        }

        function hideElement(id) {
            document.getElementById(id).style.display = 'none';
        }

        function switchElement(oldId, newId) {
            hideElement(oldId);
            showElement(newId);
        }

        // 启动时间轴
        timeline.forEach(event => {
            setTimeout(event.action, event.time);
        });
    </script>
</body>
</html>
